<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Υπολογισμός Κυκλοφορητή</title>
  <!-- Κάρτα προεπισκόπησης (LinkedIn, μηνύματα) — η εικόνα είναι το og.png -->
  <meta name="description" content="Required pump head and flow for closed or open hydronic circuits — water or glycol, parallel branches with index circuit, velocity and pressure-drop checks, pump operating point.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pump Head Calculator">
  <meta property="og:description" content="Required pump head and flow for closed or open hydronic circuits — water or glycol, parallel branches with index circuit, velocity and pressure-drop checks, pump operating point.">
  <meta property="og:url" content="https://vkocmac.github.io/PumpCalculator/">
  <meta property="og:image" content="https://vkocmac.github.io/PumpCalculator/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Νέα έκδοση = νέο APP_VERSION (ίδιο με version.txt και data.js). Ο browser
       δεν κρατά παλιά αρχεία: no-cache + ?v= + έλεγχος version.txt στο άνοιγμα. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>window.APP_VERSION = "2.6.1";</script>
  <link rel="stylesheet" href="styles.css?v=2.6.1">
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>Υπολογισμός κυκλοφορητή</h1>
    <p>Απαιτούμενο μανομετρικό και παροχή για κύκλωμα νερού ή γλυκόλης.</p>
  </header>

  <div class="workspace">
    <main class="main" id="flowMain"></main>
    <aside class="side" id="side"></aside>
  </div>

  <footer class="site-footer">
    Δεδομένα (σωλήνες, εξαρτήματα, ρευστά, όρια) στο <code>data.js</code> — αλλάζουν χωρίς να αγγίξεις τον κώδικα.
  </footer>
</div>
<div class="lc-mbar" id="mbar"></div>
<aside class="drawer" id="drawer" hidden aria-label="Στοιχεία επιλεγμένου"></aside>

<input type="file" id="fileInput" accept=".html,.htm,.json,application/json,text/html" hidden>

<script src="data.js?v=2.6.1"></script>
<script src="app.js?v=2.6.1"></script>
<script>
  // Αν το site έχει νεότερη έκδοση από αυτή που φόρτωσε ο browser, ξαναφόρτωσε μία φορά.
  (function () {
    if (location.protocol === "file:" || !window.fetch) return;
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (v) {
      v = (v || "").trim();
      if (!v || v === window.APP_VERSION) return;
      var k = "pumpcalc.reload." + v;
      try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch (e) { return; }
      location.reload();
    }).catch(function () { });
  })();
</script>
</body>
</html>
